# Tests HerdrDroid on every push and pull request, including the SSH-over-WebSocket end-to-end
# test. Signed APKs are built on demo-box and committed to release/; CI holds no signing key.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      # A throwaway sshd behind websockify, for the SSH-over-WebSocket end-to-end test.
      - name: WebSocket test server
        run: |
          docker build -q -t hdws-test tools/ws-test-server
          docker run -d --name hdws-srv -p 8080:8080 hdws-test
          sleep 3
          mkdir -p e2e
          docker cp hdws-srv:/tmp/good e2e/good
          docker cp hdws-srv:/tmp/bad e2e/bad
          echo "HD_WS_URL=ws://127.0.0.1:8080/" >> "$GITHUB_ENV"
          echo "HD_WS_KEY=$PWD/e2e/good" >> "$GITHUB_ENV"
          echo "HD_WS_BADKEY=$PWD/e2e/bad" >> "$GITHUB_ENV"
          echo "HD_WS_FP=$(docker exec hdws-srv ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew --no-daemon --console=plain testReleaseUnitTest

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Clean up
        if: always()
        run: |
          docker rm -f hdws-srv >/dev/null 2>&1 || true
          rm -rf e2e
