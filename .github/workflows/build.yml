# Tests HerdrDroid on every push and pull request: the unit tests, the Compose UI tests under
# Robolectric and the SSH-over-WebSocket end-to-end test in one job, and the same Compose UI tests
# on an Android emulator in a second job. Then it builds the APK. With the signing secrets set it is signed with the sideload key, so it installs
# over the app; without them it is built unsigned, with a warning. A v* tag attaches it to a release.
#
# The secrets (KEYSTORE_B64, SIGNING_PROPERTIES) come from keystore/push-signing-secrets.sh, run by
# the owner from the folder that holds the key.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$SIGNING_PROPERTIES" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/herdrdroid-sideload.jks
            printf '%s\n' "$SIGNING_PROPERTIES" > keystore/signing.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: the APK is built unsigned (it won't install over the signed app)."
          fi

      # A throwaway sshd behind websockify, for the SSH-over-WebSocket end-to-end test.
      - name: WebSocket test server
        run: |
          docker build -q -t hdws-test tools/ws-test-server
          docker run -d --name hdws-srv -p 8080:8080 hdws-test
          sleep 3
          mkdir -p e2e
          docker cp hdws-srv:/tmp/good e2e/good
          docker cp hdws-srv:/tmp/bad e2e/bad
          echo "HD_WS_URL=ws://127.0.0.1:8080/" >> "$GITHUB_ENV"
          echo "HD_WS_KEY=$PWD/e2e/good" >> "$GITHUB_ENV"
          echo "HD_WS_BADKEY=$PWD/e2e/bad" >> "$GITHUB_ENV"
          echo "HD_WS_FP=$(docker exec hdws-srv ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub | cut -d' ' -f2)" >> "$GITHUB_ENV"

      # A throwaway SSH server running both the herdr TUI and herdr-core (the Herdr App's server),
      # for the backend end-to-end test.
      - name: herdr test server
        run: |
          docker build -q -t hc-e2e tools/hc-e2e
          mkdir -p e2e/hckeys && chmod 777 e2e/hckeys
          docker run -d --name hc-e2e-srv -p 2222:22 -v "$PWD/e2e/hckeys:/keys" hc-e2e
          for i in $(seq 1 30); do docker logs hc-e2e-srv 2>&1 | grep -q ready && break; sleep 2; done
          sleep 5
          echo "HD_HC_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "HD_HC_PORT=2222" >> "$GITHUB_ENV"
          echo "HD_HC_KEY=$PWD/e2e/hckeys/id" >> "$GITHUB_ENV"
          echo "HD_HC_USER=dev" >> "$GITHUB_ENV"

      - name: Tests
        # Unit tests and the Compose UI tests (src/sharedTest) under Robolectric.
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: APK
        run: |
          ./gradlew --no-daemon --console=plain assembleRelease
          v=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          mkdir -p out
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "out/HerdrDroid-$v.apk"
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "out/HerdrDroid-$v.apk" | head -2
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "out/HerdrDroid-$v-unsigned.apk"
          fi
          sha256sum out/*.apk

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: HerdrDroid-apk
          path: out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.apk --title "HerdrDroid ${GITHUB_REF_NAME#v}" --notes "Built by CI from $GITHUB_SHA."

      - name: Clean up
        if: always()
        run: |
          docker rm -f hdws-srv >/dev/null 2>&1 || true
          rm -rf e2e keystore/herdrdroid-sideload.jks keystore/signing.properties

  # The Compose UI tests again, on a real Android emulator (instrumented).
  ui-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The emulator's data partition needs several GB; the runner's preinstalled toolchains it
      # doesn't use are removed first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest

      - name: Emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
